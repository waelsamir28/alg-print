name: 🚀 Release (GitHub Release + Live Site)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # 1) بناء البرنامج ورفعه كـ Release
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/index.html release/SMART-PRINT-${{ github.ref_name }}.html
          cp README.md release/README.md || true
          ls -lh release

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: SMART PRINT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/SMART-PRINT-${{ github.ref_name }}.html
          body: |
            ## 🖨 SMART PRINT ${{ github.ref_name }} — للطباعة المتقدمة

            ### التحميل
            حمّل الملف `SMART-PRINT-${{ github.ref_name }}.html` وافتحه بأي متصفح
            (Chrome / Edge). ملف واحد فقط — يعمل **بدون تثبيت وبدون إنترنت**.

            ### التفعيل
            1. البرنامج يعمل **15 يوماً** كتجربة كاملة.
            2. بعدها: افتح زر **«تفعيل»** وانسخ **كود الجهاز** (8 خانات).
            3. أرسل الكود على واتساب: **01222355769**.
            4. ستصلك سيريال التفعيل — الصقه واضغط «تفعيل النسخة الكاملة».
            5. تفعيل **مدى الحياة** ويعمل أوفلاين.

            ### المميزات
            - طباعة مجمّعة PDF/Word/صور + أوضاع التوفير والكتيب
            - اسكانر + OCR عربي
            - أدوات PDF: دمج / تقسيم / إعادة ترتيب الصفحات
            - مقارنة A/B بين نسختين (Diff)
            - ضغط الصور لتوفير الحبر
            - واترمارك + توقيع إلكتروني + طابور طباعة + مخزون أحبار

            ---
            تصميم وتنفيذ **م/ وائل الجمال** — 01222355769
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 2) نشر نسخة الويب على GitHub Pages (اختياري)
  # ─────────────────────────────────────────────
  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
