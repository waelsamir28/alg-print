name: ✅ Build & Verify (React App)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: TypeScript + Build + Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build single-file app
        run: npm run build

      - name: Show build size
        run: ls -lh dist/index.html

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: SMART-PRINT-Web-Build
          path: dist/index.html
          retention-days: 30

      # صفحة التفعيل للمطوّر تُبنى من الـ Secret وتُرفع كـ Artifact خاص
      - name: Build developer keygen (private)
        if: ${{ secrets.LICENSE_KEYS != '' }}
        run: node scripts/build-keygen.mjs
        env:
          LICENSE_KEYS: ${{ secrets.LICENSE_KEYS }}
          KEYGEN_PIN: ${{ secrets.KEYGEN_PIN }}

      - name: Upload developer keygen (private)
        if: ${{ secrets.LICENSE_KEYS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMART-PRINT-Developer-Keygen-PRIVATE
          path: dist-private/smartprint-keygen.html
          retention-days: 7
